apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rdt-client-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdt-client
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rdt-client
  template:
    metadata:
      labels:
        app: rdt-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rdt-client
          image: rdt-client:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6500
          env:
            - name: Database__Path
              value: /data/db/rdtclient.db
            - name: Logging__File__Path
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rdt-client-data
---
apiVersion: v1
kind: Service
metadata:
  name: rdt-client
spec:
  selector:
    app: rdt-client
  ports:
    - name: http
      port: 80
      targetPort: http
